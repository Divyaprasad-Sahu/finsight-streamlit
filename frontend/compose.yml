services:
  streamlit:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: finsight-streamlit:local
    environment:
      FINSIGHT_METRICS_HOST: 0.0.0.0
    ports: ["127.0.0.1:8501:8501"]
    restart: unless-stopped
  exporter:
    image: finsight-streamlit:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    command: ["python", "frontend/exporter.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/metrics', timeout=3)"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in frontend/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/finsight.json:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
volumes:
  grafana-data:
