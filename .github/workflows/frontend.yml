name: Streamlit frontend CI
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: pip install -r frontend/requirements.txt
      - run: python -m unittest discover -s frontend -p 'test_*.py' -v
      - name: Build and smoke-test
        run: |
          docker build -t finsight:test -f frontend/Dockerfile .
          docker run -d --name finsight-test -p 8501:8501 finsight:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs finsight-test
          exit 1
      - name: Publish immutable image (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/streamlit:${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag finsight:test "$IMAGE"
          docker push "$IMAGE"
